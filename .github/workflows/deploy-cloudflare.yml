# Deploy on push to feat/implement-cancel-button (Coverage + App).
# Storybook: workflow_dispatch only (checkbox) — build ~25min.
#
# GitHub Actions secrets (repo → Settings → Secrets → Actions):
#   CLOUDFLARE_API_TOKEN — start from template "Edit Cloudflare Workers", then add:
#     Account → Cloudflare Pages — Edit
#   CLOUDFLARE_ACCOUNT_ID — 32-char hex from Workers & Pages sidebar (not email, not zone id)
# Token must be scoped to the same account as CLOUDFLARE_ACCOUNT_ID.

name: Deploy to Cloudflare

on:
  push:
    branches:
      - feat/implement-cancel-button
  workflow_dispatch:
    inputs:
      deploy_storybook:
        description: Also build and deploy Storybook (~25 min)
        type: boolean
        default: false

concurrency:
  group: cloudflare-deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  PNPM_VERSION: "10.24.0"
  NODE_VERSION: "22"

jobs:
  deploy-coverage:
    name: Coverage → Pages
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Require Cloudflare secrets
        run: |
          test -n "${{ secrets.CLOUDFLARE_API_TOKEN }}" || (echo "Missing CLOUDFLARE_API_TOKEN secret" && exit 1)
          test -n "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}" || (echo "Missing CLOUDFLARE_ACCOUNT_ID secret" && exit 1)

      - run: pnpm install --frozen-lockfile

      - name: Run tests with coverage (no snapshots, no workerd)
        run: pnpm run test:coverage:ci
        env:
          VITEST: "true"
          CI: "true"

      - name: Verify coverage output
        run: test -f coverage/index.html

      - name: Deploy to chatbot-ui-coverage
        run: |
          BRANCH_SLUG="${GITHUB_REF_NAME//\//-}"
          pnpm exec wrangler pages deploy coverage \
            --project-name=chatbot-ui-coverage \
            --branch="${BRANCH_SLUG}" \
            --commit-dirty=true
          echo "### Coverage" >> "$GITHUB_STEP_SUMMARY"
          echo "https://${BRANCH_SLUG}.chatbot-ui-coverage.pages.dev" >> "$GITHUB_STEP_SUMMARY"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  deploy-app:
    name: Next.js app → Workers
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Require Cloudflare secrets
        run: |
          test -n "${{ secrets.CLOUDFLARE_API_TOKEN }}" || (echo "Missing CLOUDFLARE_API_TOKEN secret" && exit 1)
          test -n "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}" || (echo "Missing CLOUDFLARE_ACCOUNT_ID secret" && exit 1)

      - run: pnpm install --frozen-lockfile

      - name: Build native deps (pnpm 10 / OpenNext)
        run: pnpm rebuild esbuild workerd sharp @swc/core 2>/dev/null || true

      - name: Build OpenNext bundle
        run: pnpm exec opennextjs-cloudflare build
        env:
          CI: "true"

      - name: Verify OpenNext worker bundle
        run: test -f .open-next/worker.js

      - name: Resolve Cloudflare account ID
        id: cf_account
        run: node scripts/ci-resolve-cloudflare-account.mjs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Verify Cloudflare token
        run: |
          set -euo pipefail
          VERIFY="$(curl -sS "https://api.cloudflare.com/client/v4/user/tokens/verify" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}")"
          echo "$VERIFY" | grep -q '"success":true' || {
            echo "::error::CLOUDFLARE_API_TOKEN is invalid. Recreate from template Edit Cloudflare Workers + Pages Edit."
            echo "$VERIFY"
            exit 1
          }
          ACCOUNT_ID="${{ steps.cf_account.outputs.account_id }}"
          WORKERS_HTTP="$(curl -sS -o /tmp/workers-probe.json -w '%{http_code}' \
            "https://api.cloudflare.com/client/v4/accounts/${ACCOUNT_ID}/workers/scripts/ai-sdk" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}")"
          echo "workers/scripts/ai-sdk HTTP ${WORKERS_HTTP}"
          if [ "$WORKERS_HTTP" = "401" ] || [ "$WORKERS_HTTP" = "403" ]; then
            echo "::error::Token cannot deploy Workers on account ${ACCOUNT_ID}."
            cat /tmp/workers-probe.json || true
            exit 1
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Inject account_id into wrangler.jsonc
        run: node scripts/ci-inject-wrangler-account.mjs
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ steps.cf_account.outputs.account_id }}

      - name: Wrangler whoami
        run: pnpm exec wrangler whoami
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ steps.cf_account.outputs.account_id }}

      - name: Deploy Worker (ai-sdk)
        run: bash scripts/ci-cloudflare-deploy.sh
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ steps.cf_account.outputs.account_id }}
          CI: "true"

      - name: App URL
        run: |
          echo "### App (Worker)" >> "$GITHUB_STEP_SUMMARY"
          echo "https://ai-sdk.ha-nguyenthanh.workers.dev" >> "$GITHUB_STEP_SUMMARY"

  deploy-storybook:
    name: Storybook → Pages
    if: github.event_name == 'workflow_dispatch' && inputs.deploy_storybook
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Require Cloudflare secrets
        run: |
          test -n "${{ secrets.CLOUDFLARE_API_TOKEN }}" || (echo "Missing CLOUDFLARE_API_TOKEN secret" && exit 1)
          test -n "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}" || (echo "Missing CLOUDFLARE_ACCOUNT_ID secret" && exit 1)

      - run: pnpm install --frozen-lockfile

      - name: Build Storybook
        run: pnpm run build-storybook
        env:
          NODE_OPTIONS: --max-old-space-size=6144

      - name: Verify Storybook output
        run: test -f storybook-static/index.html

      - name: Deploy to chatbot-ui-storybook
        run: |
          BRANCH_SLUG="${GITHUB_REF_NAME//\//-}"
          pnpm exec wrangler pages deploy storybook-static \
            --project-name=chatbot-ui-storybook \
            --branch="${BRANCH_SLUG}" \
            --commit-dirty=true
          echo "### Storybook" >> "$GITHUB_STEP_SUMMARY"
          echo "https://${BRANCH_SLUG}.chatbot-ui-storybook.pages.dev" >> "$GITHUB_STEP_SUMMARY"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  deploy-summary:
    name: Deploy links
    needs: [deploy-coverage, deploy-app]
    if: success()
    runs-on: ubuntu-latest
    steps:
      - name: Preview URLs (Coverage + App)
        run: |
          BRANCH_SLUG="${GITHUB_REF_NAME//\//-}"
          echo "## Deploy OK — ${GITHUB_REF_NAME}" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Site | URL |" >> "$GITHUB_STEP_SUMMARY"
          echo "|------|-----|" >> "$GITHUB_STEP_SUMMARY"
          echo "| **App** | https://ai-sdk.ha-nguyenthanh.workers.dev |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Coverage** | https://${BRANCH_SLUG}.chatbot-ui-coverage.pages.dev |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Storybook: re-run workflow with **Also build and deploy Storybook** checked." >> "$GITHUB_STEP_SUMMARY"
