# One workflow: app (production on main, preview on other branches), Storybook, coverage.
# Triggers on every push to any branch — no per-branch YAML changes.
#
# Prerequisites (Cloudflare Dashboard, once per account):
#   - Workers project / wrangler name matches wrangler.jsonc ("ai-sdk")
#   - Pages projects: chatbot-ui-storybook, chatbot-ui-coverage (production branch can stay "main")
#
# GitHub repo → Settings → Secrets and variables → Actions:
#   CLOUDFLARE_API_TOKEN — API token with at least:
#     User / User Details — Read
#     Account / Account Settings — Read
#     Account / Workers Scripts — Edit
#     Account / Workers Services — Edit
#     Account / Cloudflare Pages — Edit
#   CLOUDFLARE_ACCOUNT_ID — Workers sidebar → Account ID

name: Deploy to Cloudflare

on:
  push:
  workflow_dispatch:

concurrency:
  group: cloudflare-deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  PNPM_VERSION: "10.24.0"
  NODE_VERSION: "22"
  WRANGLER_VERSION: "4.93.1"
  PAGES_STORYBOOK_PROJECT: chatbot-ui-storybook
  PAGES_COVERAGE_PROJECT: chatbot-ui-coverage

jobs:
  cloudflare_app:
    name: Next.js app → Workers
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Require Cloudflare secrets
        run: |
          test -n "${{ secrets.CLOUDFLARE_API_TOKEN }}" || (echo "Missing CLOUDFLARE_API_TOKEN" && exit 1)
          test -n "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}" || (echo "Missing CLOUDFLARE_ACCOUNT_ID" && exit 1)

      - run: pnpm install --frozen-lockfile

      - name: Build native deps (OpenNext)
        run: pnpm rebuild esbuild workerd sharp @swc/core 2>/dev/null || true

      - name: Build OpenNext bundle
        run: pnpm exec opennextjs-cloudflare build
        env:
          CI: "true"

      - name: Deploy Worker
        run: bash scripts/ci-cloudflare-deploy.sh
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_DEPLOY_PRODUCTION: ${{ github.ref == 'refs/heads/main' }}
          CLOUDFLARE_PREVIEW_ALIAS: ${{ github.ref_name }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          CI: "true"

      - name: App deploy note
        run: |
          BRANCH_SLUG="${GITHUB_REF_NAME//\//-}"
          BRANCH_SLUG="$(echo "$BRANCH_SLUG" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9-]+/-/g; s/^-+|-+$//g' | cut -c1-50)"
          echo "### App (Worker)" >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "Production deploy from \`main\` — see Cloudflare Workers dashboard for the live URL." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Preview alias: \`${BRANCH_SLUG}\`" >> "$GITHUB_STEP_SUMMARY"
            echo "Preview: \`https://${BRANCH_SLUG}-ai-sdk.<account-subdomain>.workers.dev\` (exact host in wrangler log above)" >> "$GITHUB_STEP_SUMMARY"
          fi

  cloudflare_storybook:
    name: Storybook → Pages
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Require Cloudflare secrets
        run: |
          test -n "${{ secrets.CLOUDFLARE_API_TOKEN }}" || (echo "Missing CLOUDFLARE_API_TOKEN" && exit 1)
          test -n "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}" || (echo "Missing CLOUDFLARE_ACCOUNT_ID" && exit 1)

      - run: pnpm install --frozen-lockfile

      - name: Build Storybook
        run: pnpm run build-storybook
        env:
          NODE_OPTIONS: --max-old-space-size=6144

      - name: Verify Storybook output
        run: test -f storybook-static/index.html

      - name: Deploy to Pages
        run: |
          BRANCH_SLUG="${GITHUB_REF_NAME//\//-}"
          pnpm exec wrangler pages deploy storybook-static \
            --project-name="${{ env.PAGES_STORYBOOK_PROJECT }}" \
            --branch="${BRANCH_SLUG}" \
            --commit-dirty=true
          echo "### Storybook" >> "$GITHUB_STEP_SUMMARY"
          echo "Branch slug: \`${BRANCH_SLUG}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "Preview: \`https://${BRANCH_SLUG}.${{ env.PAGES_STORYBOOK_PROJECT }}.pages.dev\` (if using *.pages.dev)" >> "$GITHUB_STEP_SUMMARY"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  cloudflare_coverage:
    name: Coverage → Pages
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Require Cloudflare secrets
        run: |
          test -n "${{ secrets.CLOUDFLARE_API_TOKEN }}" || (echo "Missing CLOUDFLARE_API_TOKEN" && exit 1)
          test -n "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}" || (echo "Missing CLOUDFLARE_ACCOUNT_ID" && exit 1)

      - run: pnpm install --frozen-lockfile

      - name: Unit tests + coverage
        run: |
          pnpm run test:update
          pnpm run test:coverage:ci
        env:
          VITEST: "true"
          CI: "true"

      - name: Deploy to Pages
        run: |
          BRANCH_SLUG="${GITHUB_REF_NAME//\//-}"
          pnpm exec wrangler pages deploy coverage \
            --project-name="${{ env.PAGES_COVERAGE_PROJECT }}" \
            --branch="${BRANCH_SLUG}" \
            --commit-dirty=true
          echo "### Coverage report" >> "$GITHUB_STEP_SUMMARY"
          echo "Branch slug: \`${BRANCH_SLUG}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "Preview: \`https://${BRANCH_SLUG}.${{ env.PAGES_COVERAGE_PROJECT }}.pages.dev\`" >> "$GITHUB_STEP_SUMMARY"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  cloudflare_summary:
    name: Deploy summary
    needs: [cloudflare_storybook, cloudflare_coverage, cloudflare_app]
    if: >-
      always() && !cancelled()
      && needs.cloudflare_storybook.result == 'success'
      && needs.cloudflare_coverage.result == 'success'
      && needs.cloudflare_app.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Links
        run: |
          BRANCH_SLUG="${GITHUB_REF_NAME//\//-}"
          echo "## Cloudflare — ${GITHUB_REF_NAME}" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Target | Notes |" >> "$GITHUB_STEP_SUMMARY"
          echo "|--------|--------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Storybook** | \`https://${BRANCH_SLUG}.${{ env.PAGES_STORYBOOK_PROJECT }}.pages.dev\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Coverage** | \`https://${BRANCH_SLUG}.${{ env.PAGES_COVERAGE_PROJECT }}.pages.dev\` |" >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "| **App (Worker)** | Production — Cloudflare Workers dashboard |" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "| **App (Worker)** | \`https://${BRANCH_SLUG}-ai-sdk.<account-subdomain>.workers.dev\` (preview) |" >> "$GITHUB_STEP_SUMMARY"
          fi
