# Deploy app (Workers), Storybook, and coverage (Pages) on push.
#
# Required GitHub secrets:
# - CLOUDFLARE_API_TOKEN
# - CLOUDFLARE_ACCOUNT_ID
#
# Required Cloudflare resources:
# - Worker name matches `wrangler.jsonc` ("ai-sdk")
# - Pages projects: chatbot-ui-storybook, chatbot-ui-coverage

name: Deploy to Cloudflare

on:
  push:
    branches:
      - fix/redeploy-cloudflare
      - feat/quick-actions-above-composer
      - feat/composer-file-attachment
      - feat/composer-file-attachment-tests
      - main
  workflow_dispatch:

concurrency:
  group: cloudflare-deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  PNPM_VERSION: "10.24.0"
  NODE_VERSION: "22"
  WRANGLER_VERSION: "4.93.1"
  PAGES_STORYBOOK_PROJECT: chatbot-ui-storybook
  PAGES_COVERAGE_PROJECT: chatbot-ui-coverage
  APP_WORKER_URL: https://ai-sdk.ha-nguyenthanh.workers.dev

jobs:
  deploy-app:
    name: Next.js app → Workers
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Require Cloudflare secrets
        run: |
          test -n "${{ secrets.CLOUDFLARE_API_TOKEN }}" || (echo "Missing CLOUDFLARE_API_TOKEN" && exit 1)
          test -n "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}" || (echo "Missing CLOUDFLARE_ACCOUNT_ID" && exit 1)

      - run: pnpm install --frozen-lockfile

      - name: Inject account_id into wrangler.jsonc
        run: node scripts/ci-inject-wrangler-account.mjs
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Build native deps (OpenNext)
        run: pnpm rebuild esbuild workerd sharp @swc/core 2>/dev/null || true

      - name: Build OpenNext bundle
        run: pnpm exec opennextjs-cloudflare build
        env:
          CI: "true"

      - name: Deploy Worker
        run: bash scripts/ci-cloudflare-deploy.sh
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_DEPLOY_PRODUCTION: ${{ github.ref == 'refs/heads/main' }}
          CLOUDFLARE_PREVIEW_ALIAS: ${{ github.ref_name }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          CI: "true"

  deploy-storybook:
    name: Storybook → Pages
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Require Cloudflare secrets
        run: |
          test -n "${{ secrets.CLOUDFLARE_API_TOKEN }}" || (echo "Missing CLOUDFLARE_API_TOKEN" && exit 1)
          test -n "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}" || (echo "Missing CLOUDFLARE_ACCOUNT_ID" && exit 1)

      - run: pnpm install --frozen-lockfile

      - name: Build Storybook
        run: pnpm run build-storybook
        env:
          NODE_OPTIONS: --max-old-space-size=6144

      - name: Verify Storybook output
        run: test -f storybook-static/index.html

      - name: Deploy to Pages
        run: |
          BRANCH_SLUG="${GITHUB_REF_NAME//\//-}"
          pnpm exec wrangler pages deploy storybook-static \
            --project-name="${{ env.PAGES_STORYBOOK_PROJECT }}" \
            --branch="${BRANCH_SLUG}" \
            --commit-dirty=true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  deploy-coverage:
    name: Coverage → Pages
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Require Cloudflare secrets
        run: |
          test -n "${{ secrets.CLOUDFLARE_API_TOKEN }}" || (echo "Missing CLOUDFLARE_API_TOKEN" && exit 1)
          test -n "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}" || (echo "Missing CLOUDFLARE_ACCOUNT_ID" && exit 1)

      - run: pnpm install --frozen-lockfile

      - name: Unit tests + coverage
        run: |
          pnpm run test:update
          pnpm run test:coverage:ci
        env:
          VITEST: "true"
          CI: "true"

      - name: Deploy to Pages
        run: |
          BRANCH_SLUG="${GITHUB_REF_NAME//\//-}"
          pnpm exec wrangler pages deploy coverage \
            --project-name="${{ env.PAGES_COVERAGE_PROJECT }}" \
            --branch="${BRANCH_SLUG}" \
            --commit-dirty=true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  deploy-summary:
    name: Deploy summary
    needs: [deploy-storybook, deploy-coverage, deploy-app]
    if: >-
      always() && !cancelled()
      && needs.deploy-storybook.result == 'success'
      && needs.deploy-coverage.result == 'success'
      && needs.deploy-app.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Links
        run: |
          BRANCH_SLUG="${GITHUB_REF_NAME//\//-}"
          echo "## Cloudflare — ${GITHUB_REF_NAME}" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Target | URL |" >> "$GITHUB_STEP_SUMMARY"
          echo "|--------|-----|" >> "$GITHUB_STEP_SUMMARY"
          echo "| **App** | ${{ env.APP_WORKER_URL }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Storybook** | https://${BRANCH_SLUG}.${{ env.PAGES_STORYBOOK_PROJECT }}.pages.dev |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Coverage** | https://${BRANCH_SLUG}.${{ env.PAGES_COVERAGE_PROJECT }}.pages.dev |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "OpenAI key check: \`POST ${{ env.APP_WORKER_URL }}/api/validate-openai-key\`" >> "$GITHUB_STEP_SUMMARY"
