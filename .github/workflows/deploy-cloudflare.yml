# Deploy on push to feat/implement-cancel-button.
# Uses `pnpm exec wrangler` (not wrangler-action) — avoids extra pnpm install failures in CI.
#
# Secrets: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID

name: Deploy to Cloudflare

on:
  push:
    branches:
      - feat/implement-cancel-button
  workflow_dispatch:

# Do not cancel an in-flight Storybook build when a new commit is pushed.
concurrency:
  group: cloudflare-deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  PNPM_VERSION: "10.24.0"
  NODE_VERSION: "22"

jobs:
  deploy-coverage:
    name: Coverage → Pages
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Require Cloudflare secrets
        run: |
          test -n "${{ secrets.CLOUDFLARE_API_TOKEN }}" || (echo "Missing CLOUDFLARE_API_TOKEN secret" && exit 1)
          test -n "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}" || (echo "Missing CLOUDFLARE_ACCOUNT_ID secret" && exit 1)

      - run: pnpm install --frozen-lockfile

      - name: Run tests with coverage (no snapshots)
        run: pnpm run test:coverage:ci

      - name: Verify coverage output
        run: test -f coverage/index.html

      - name: Deploy to chatbot-ui-coverage
        run: |
          BRANCH_SLUG="${GITHUB_REF_NAME//\//-}"
          pnpm exec wrangler pages deploy coverage \
            --project-name=chatbot-ui-coverage \
            --branch="${BRANCH_SLUG}" \
            --commit-dirty=true
          echo "### Coverage" >> "$GITHUB_STEP_SUMMARY"
          echo "https://${BRANCH_SLUG}.chatbot-ui-coverage.pages.dev" >> "$GITHUB_STEP_SUMMARY"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  deploy-app:
    name: Next.js app → Workers
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Require Cloudflare secrets
        run: |
          test -n "${{ secrets.CLOUDFLARE_API_TOKEN }}" || (echo "Missing CLOUDFLARE_API_TOKEN secret" && exit 1)
          test -n "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}" || (echo "Missing CLOUDFLARE_ACCOUNT_ID secret" && exit 1)

      - run: pnpm install --frozen-lockfile

      - name: Build native deps (pnpm 10 / OpenNext)
        run: pnpm rebuild esbuild workerd sharp @swc/core 2>/dev/null || true

      - name: Build OpenNext bundle
        run: pnpm exec opennextjs-cloudflare build
        env:
          CI: "true"

      - name: Verify OpenNext worker bundle
        run: test -f .open-next/worker.js

      - name: Deploy Worker (ai-sdk)
        run: pnpm exec wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: App URL
        run: |
          echo "### App (Worker)" >> "$GITHUB_STEP_SUMMARY"
          echo "https://ai-sdk.ha-nguyenthanh.workers.dev" >> "$GITHUB_STEP_SUMMARY"

  deploy-storybook:
    name: Storybook → Pages
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Require Cloudflare secrets
        run: |
          test -n "${{ secrets.CLOUDFLARE_API_TOKEN }}" || (echo "Missing CLOUDFLARE_API_TOKEN secret" && exit 1)
          test -n "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}" || (echo "Missing CLOUDFLARE_ACCOUNT_ID secret" && exit 1)

      - run: pnpm install --frozen-lockfile

      - name: Build Storybook
        run: pnpm run build-storybook
        env:
          NODE_OPTIONS: --max-old-space-size=6144

      - name: Verify Storybook output
        run: test -f storybook-static/index.html

      - name: Deploy to chatbot-ui-storybook
        run: |
          BRANCH_SLUG="${GITHUB_REF_NAME//\//-}"
          pnpm exec wrangler pages deploy storybook-static \
            --project-name=chatbot-ui-storybook \
            --branch="${BRANCH_SLUG}" \
            --commit-dirty=true
          echo "### Storybook" >> "$GITHUB_STEP_SUMMARY"
          echo "https://${BRANCH_SLUG}.chatbot-ui-storybook.pages.dev" >> "$GITHUB_STEP_SUMMARY"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  deploy-summary:
    name: Deploy links
    needs: [deploy-coverage, deploy-app, deploy-storybook]
    if: success()
    runs-on: ubuntu-latest
    steps:
      - name: All preview URLs
        run: |
          BRANCH_SLUG="${GITHUB_REF_NAME//\//-}"
          echo "## Cloudflare deploy (${GITHUB_REF_NAME})" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Site | URL |" >> "$GITHUB_STEP_SUMMARY"
          echo "|------|-----|" >> "$GITHUB_STEP_SUMMARY"
          echo "| App | https://ai-sdk.ha-nguyenthanh.workers.dev |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Coverage | https://${BRANCH_SLUG}.chatbot-ui-coverage.pages.dev |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Storybook | https://${BRANCH_SLUG}.chatbot-ui-storybook.pages.dev |" >> "$GITHUB_STEP_SUMMARY"
