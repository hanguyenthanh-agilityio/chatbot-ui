# Auto-deploy on push to configured branches (see `on.push.branches`).
# Pages previews use the pushed branch name via github.ref_name.
#
# Required GitHub secrets (Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN  — Custom token (not Global API Key) with at least:
#     User / User Details — Read
#     Account / Account Settings — Read
#     Account / Workers Scripts — Edit
#     Account / Workers Services — Edit  (required for service bindings)
#     Account / Cloudflare Pages — Edit
#   CLOUDFLARE_ACCOUNT_ID — Dashboard → Workers → right sidebar Account ID

name: Deploy to Cloudflare

on:
  push:
    branches:
      - feat/cloudflare-deploy
      - feat/update-transcript-light-dark-mode
  workflow_dispatch:
    inputs:
      deploy_storybook:
        description: Also build and deploy Storybook (~25 min)
        type: boolean
        default: false

concurrency:
  group: cloudflare-deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  PNPM_VERSION: "10.24.0"
  NODE_VERSION: "22"

jobs:
  deploy-storybook:
    name: Storybook → Pages
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Require Cloudflare secrets
        run: |
          test -n "${{ secrets.CLOUDFLARE_API_TOKEN }}" || (echo "Missing CLOUDFLARE_API_TOKEN secret" && exit 1)
          test -n "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}" || (echo "Missing CLOUDFLARE_ACCOUNT_ID secret" && exit 1)

      - run: pnpm install --frozen-lockfile

      - name: Build Storybook
        run: pnpm run build-storybook
        env:
          NODE_OPTIONS: --max-old-space-size=6144

      - name: Deploy to chatbot-ui-storybook
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: ${{ env.WRANGLER_VERSION }}
          command: pages deploy storybook-static --project-name=chatbot-ui-storybook --branch=${{ github.ref_name }} --commit-dirty=true

  deploy-coverage:
    name: Coverage → Pages
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Require Cloudflare secrets
        run: |
          test -n "${{ secrets.CLOUDFLARE_API_TOKEN }}" || (echo "Missing CLOUDFLARE_API_TOKEN secret" && exit 1)
          test -n "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}" || (echo "Missing CLOUDFLARE_ACCOUNT_ID secret" && exit 1)

      - run: pnpm install --frozen-lockfile

      - name: Run tests with coverage
        run: pnpm exec vitest run --config vitest.unit.config.ts --coverage
        env:
          VITEST: "true"
          CI: "true"

      - name: Deploy to chatbot-ui-coverage
        run: >
          pnpm exec wrangler pages deploy coverage
          --project-name=chatbot-ui-coverage
          --branch=${{ github.ref_name }}
          --commit-dirty=true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  deploy-app:
    name: Next.js app → Workers
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Require Cloudflare secrets
        run: |
          test -n "${{ secrets.CLOUDFLARE_API_TOKEN }}" || (echo "Missing CLOUDFLARE_API_TOKEN secret" && exit 1)
          test -n "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}" || (echo "Missing CLOUDFLARE_ACCOUNT_ID secret" && exit 1)

      - run: pnpm install --frozen-lockfile

      - name: Build native deps (pnpm 10 / OpenNext)
        run: pnpm rebuild esbuild workerd sharp @swc/core 2>/dev/null || true

      - name: Build OpenNext bundle
        run: pnpm exec opennextjs-cloudflare build
        env:
          CI: "true"

      - name: Deploy Worker (ai-sdk)
        run: bash scripts/ci-cloudflare-deploy.sh
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ steps.cf_account.outputs.account_id }}
          CI: "true"

      - name: App URL
        run: |
          echo "### App (Worker)" >> "$GITHUB_STEP_SUMMARY"
          echo "https://ai-sdk.ha-nguyenthanh.workers.dev" >> "$GITHUB_STEP_SUMMARY"

  deploy-storybook:
    name: Storybook → Pages
    if: github.event_name == 'workflow_dispatch' && inputs.deploy_storybook
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Require Cloudflare secrets
        run: |
          test -n "${{ secrets.CLOUDFLARE_API_TOKEN }}" || (echo "Missing CLOUDFLARE_API_TOKEN secret" && exit 1)
          test -n "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}" || (echo "Missing CLOUDFLARE_ACCOUNT_ID secret" && exit 1)

      - run: pnpm install --frozen-lockfile

      - name: Build Storybook
        run: pnpm run build-storybook
        env:
          NODE_OPTIONS: --max-old-space-size=6144

      - name: Verify Storybook output
        run: test -f storybook-static/index.html

      - name: Deploy to chatbot-ui-storybook
        run: |
          BRANCH_SLUG="${GITHUB_REF_NAME//\//-}"
          pnpm exec wrangler pages deploy storybook-static \
            --project-name=chatbot-ui-storybook \
            --branch="${BRANCH_SLUG}" \
            --commit-dirty=true
          echo "### Storybook" >> "$GITHUB_STEP_SUMMARY"
          echo "https://${BRANCH_SLUG}.chatbot-ui-storybook.pages.dev" >> "$GITHUB_STEP_SUMMARY"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  deploy-summary:
    name: Deploy links
    needs: [deploy-coverage, deploy-app]
    if: success()
    runs-on: ubuntu-latest
    steps:
      - name: Preview URLs (Coverage + App)
        run: |
          BRANCH_SLUG="${GITHUB_REF_NAME//\//-}"
          echo "## Deploy OK — ${GITHUB_REF_NAME}" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Site | URL |" >> "$GITHUB_STEP_SUMMARY"
          echo "|------|-----|" >> "$GITHUB_STEP_SUMMARY"
          echo "| **App** | https://ai-sdk.ha-nguyenthanh.workers.dev |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Coverage** | https://${BRANCH_SLUG}.chatbot-ui-coverage.pages.dev |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Storybook: re-run workflow with **Also build and deploy Storybook** checked." >> "$GITHUB_STEP_SUMMARY"
