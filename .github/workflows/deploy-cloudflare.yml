# Auto-deploy on push to feat/implement-cancel-button (preview branch name = ref).
#
# Required GitHub secrets (Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN  — Custom token with Workers Scripts/Services Edit + Pages Edit
#   CLOUDFLARE_ACCOUNT_ID — Dashboard → Workers → Account ID

name: Deploy to Cloudflare

on:
  push:
    branches:
      - feat/implement-cancel-button
  workflow_dispatch:

concurrency:
  group: cloudflare-${{ github.workflow }}-${{ github.job }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PNPM_VERSION: "10.24.0"
  NODE_VERSION: "22"
  WRANGLER_VERSION: "4.93.1"

jobs:
  deploy-storybook:
    name: Storybook → Pages
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Require Cloudflare secrets
        run: |
          test -n "${{ secrets.CLOUDFLARE_API_TOKEN }}" || (echo "Missing CLOUDFLARE_API_TOKEN secret" && exit 1)
          test -n "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}" || (echo "Missing CLOUDFLARE_ACCOUNT_ID secret" && exit 1)

      - run: pnpm install --frozen-lockfile

      - name: Build Storybook
        run: pnpm run build-storybook
        env:
          NODE_OPTIONS: --max-old-space-size=6144

      - name: Deploy to chatbot-ui-storybook
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: ${{ env.WRANGLER_VERSION }}
          command: pages deploy storybook-static --project-name=chatbot-ui-storybook --branch=${{ github.ref_name }} --commit-dirty=true

  deploy-coverage:
    name: Coverage → Pages
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Require Cloudflare secrets
        run: |
          test -n "${{ secrets.CLOUDFLARE_API_TOKEN }}" || (echo "Missing CLOUDFLARE_API_TOKEN secret" && exit 1)
          test -n "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}" || (echo "Missing CLOUDFLARE_ACCOUNT_ID secret" && exit 1)

      - run: pnpm install --frozen-lockfile

      - name: Run tests with coverage (no snapshots)
        run: pnpm run test:coverage:ci

      - name: Deploy to chatbot-ui-coverage
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: ${{ env.WRANGLER_VERSION }}
          command: pages deploy coverage --project-name=chatbot-ui-coverage --branch=${{ github.ref_name }} --commit-dirty=true

  deploy-app:
    name: Next.js app → Workers
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Require Cloudflare secrets
        run: |
          test -n "${{ secrets.CLOUDFLARE_API_TOKEN }}" || (echo "Missing CLOUDFLARE_API_TOKEN secret" && exit 1)
          test -n "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}" || (echo "Missing CLOUDFLARE_ACCOUNT_ID secret" && exit 1)

      - run: pnpm install --frozen-lockfile

      - name: Build native deps (pnpm 10 / OpenNext)
        run: pnpm rebuild esbuild workerd sharp @swc/core 2>/dev/null || true

      - name: Build OpenNext bundle
        run: pnpm exec opennextjs-cloudflare build
        env:
          CI: "true"

      - name: Deploy Worker (ai-sdk)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: ${{ env.WRANGLER_VERSION }}
          command: deploy
